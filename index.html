<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archive</title><style>:root{--a:#8b5cf6}*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f7f8fb;font:15px Inter,system-ui,sans-serif}header{position:sticky;top:0;background:#08090dee;backdrop-filter:blur(12px);border-bottom:1px solid #282e38;padding:16px 5vw;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{color:white;text-decoration:none;font-weight:900}.brand small{display:block;color:#7f8999;font-size:10px}nav{display:flex;gap:6px;flex-wrap:wrap}nav a{color:#98a2b2;text-decoration:none;padding:9px 12px;border-radius:9px}nav a:hover{background:var(--a);color:#fff}main{max-width:1180px;margin:auto;padding:60px 5vw}h1{font-size:clamp(44px,7vw,82px);line-height:.95;letter-spacing:-.06em;margin:0 0 15px}p{color:#9ca5b4;line-height:1.7}.heroimg{height:190px;border-radius:18px;background:linear-gradient(135deg,var(--a),#151922);display:grid;place-items:center;font-size:70px;margin:25px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}.grid>div,.card,.balance{background:#0f1218;border:1px solid #29303a;border-radius:16px;padding:20px}.grid b,.balance b{display:block;font-size:30px;margin-top:9px}.list{border:1px solid #29303a;border-radius:16px;overflow:hidden;margin-top:18px}.list>div{padding:15px 18px;border-bottom:1px solid #252b34;display:flex;justify-content:space-between;gap:12px}.chart{height:270px;display:flex;align-items:end;gap:7px;margin:25px 0}.chart i{flex:1;background:var(--a);border-radius:5px 5px 0 0}button{border:0;background:var(--a);color:#fff;padding:10px 14px;border-radius:9px;font-weight:800;cursor:pointer;margin:5px 4px 5px 0}input,select,textarea{display:block;width:100%;background:#0a0d12;border:1px solid #303744;color:#fff;border-radius:9px;padding:11px;margin:7px 0 14px}pre{color:#bfc8d5;white-space:pre-wrap}@media(max-width:760px){header{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr}main{padding:40px 5vw}}</style></head><body><header><a class="brand" href="?view=0">◉ Archive<small>LOCAL DEMO · NO DATABASE</small></a><nav><a href="?view=0">Overview</a><a href="?view=1">Books</a><a href="?view=2">Members</a><a href="?view=3">Borrowed</a></nav></header><main id="app"></main><script>let books=JSON.parse(localStorage.csBooks||'[{"id":1,"title":"The Pragmatic Programmer","status":"Available"},{"id":2,"title":"Clean Architecture","status":"Available"}]'),members=JSON.parse(localStorage.csMembers||'["Alya","Bima"]');function save(){localStorage.csBooks=JSON.stringify(books);localStorage.csMembers=JSON.stringify(members)}function render(){let v=+(new URLSearchParams(location.search).get('view')||0);app.innerHTML=v===0?'<h1>Welcome to your archive.</h1><div class="heroimg">📖</div><div class="grid"><div><small>BOOKS</small><b>'+books.length+'</b></div><div><small>AVAILABLE</small><b>'+books.filter(x=>x.status==='Available').length+'</b></div><div><small>MEMBERS</small><b>'+members.length+'</b></div></div>':v===1?'<h1>Books</h1><form onsubmit="return addB(event)"><input id="title" placeholder="Book title" required><button>Add book</button></form>'+books.map(x=>'<div class="card">'+x.title+' · '+x.status+' <button onclick="toggleB('+x.id+')">'+(x.status==='Available'?'Borrow':'Return')+'</button></div>').join(''):v===2?'<h1>Members</h1><form onsubmit="return addM(event)"><input id="member" placeholder="Member" required><button>Add member</button></form>'+members.map((x,i)=>'<div class="card">'+x+' <button onclick="members.splice('+i+',1);save();render()">Delete</button></div>').join(''):'<h1>Borrowed</h1>'+books.filter(x=>x.status==='Borrowed').map(x=>'<div class="card">'+x.title+' · Borrowed</div>').join('')||'<p>No borrowed books.</p>'}function addB(e){e.preventDefault();books.push({id:Date.now(),title:title.value,status:'Available'});save();render();return false}function addM(e){e.preventDefault();members.push(member.value);save();render();return false}function toggleB(id){let b=books.find(x=>x.id===id);b.status=b.status==='Available'?'Borrowed':'Available';save();render()}render();</script></body></html>
